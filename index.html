document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"0520e476-1f09-4d4c-acde-8b8eab92091a\"><\u002Fscript>\n  <script src=\"ef63f2d8-43a4-4486-b303-f0a1ce4c2d08\"><\u002Fscript>\n  <style>\n    * { box-sizing: border-box; }\n    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; color: #201e1d; background: #f3f2f2; }\n    a { text-decoration: none; }\n    ::selection { background: rgba(236,48,19,0.3); }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"{{ pageWrapStyle }}\">\n\n  <header style=\"{{ navBarStyle }}\">\n    <a href=\"#/\" style=\"{{ navBrandStyle }}\">\n      <img src=\"64bb0b95-2e33-486a-a3a5-54521ad0e556\" alt=\"Drivra Mobility\" style=\"{{ navLogoStyle }}\">\n    <\u002Fa>\n\n    <nav style=\"{{ navLinksRowStyle }}\" class=\"__desktop-nav\">\n      <a href=\"#/\" style=\"{{ navLinkStyleHome }}\">Home<\u002Fa>\n      <div style=\"{{ navDropdownWrapStyle }}\">\n        <button sc-camel-on-click=\"{{ toggleVentures }}\" style=\"{{ navVenturesBtnStyle }}\">\n          Ventures\n          <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" style=\"{{ chevronStyle }}\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fbutton>\n        <sc-if value=\"{{ venturesOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"{{ dropdownMenuStyle }}\">\n            <sc-for list=\"{{ ventures }}\" as=\"v\" hint-placeholder-count=\"5\">\n              <a href=\"{{ v.href }}\" sc-camel-on-click=\"{{ closeMenus }}\" style=\"{{ dropdownItemStyle }}\">\n                <span style=\"{{ dropdownItemKickerStyle }}\">{{ v.category }}<\u002Fspan>\n                <span>{{ v.name }}<\u002Fspan>\n              <\u002Fa>\n s mobility infrastructure, built venture by venture.<\u002Fh1>\n          <p style=\"{{ heroBodyStyle }}\">We operate fleets, build technology and trade vehicles — across ride-hailing, delivery, financing and electric mobility. One company, several ventures, all built for Nepal's roads.<\u002Fp>\n          <div style=\"{{ heroCtaRowStyle }}\">\n            <a href=\"#/careers\" style=\"{{ btnPrimaryStyle }}\">See our ventures<\u002Fa>\n            <a href=\"#/contact\" style=\"{{ btnSecondaryStyle }}\">Partner with us<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"{{ heroImageWrapStyle }}\">\n          <image-slot id=\"home-hero\" shape=\"rect\" placeholder=\"Fleet / rider photo\" src=\"49b57af8-d19e-4485-8dd7-a56b26ced978\" fit=\"contain\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"{{ sectionStyle }}\">\n        <div style=\"{{ sectionHeadStyle }}\">\n          <h2 style=\"{{ sectionTitleStyle }}\">What we build<\u002Fh2>\n          <p style=\"{{ sectionSubStyle }}\">Five ventures, one mobility platform.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"{{ ventureGridStyle }}\">\n          <sc-for list=\"{{ ventures }}\" as=\"v\" hint-placeholder-count=\"5\">\n            <a href=\"{{ v.href }}\" style=\"{{ ventureCardStyle }}\">\n              <span style=\"{{ cardKickerStyle }}\">{{ v.category }}<\u002Fspan>\n              <h3 style=\"{{ cardTitleStyle }}\">{{ v.name }}<\u002Fh3>\n              <p style=\"{{ cardBodyStyle }}\">{{ v.tagline }}<\u002Fp>\n              <span style=\"{{ cardLinkStyle }}\">Learn more →<\u002Fspan>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <hr style=\"{{ hrStyle }}\">\n\n      <section style=\"{{ sectionStyle }}\">\n        <div style=\"{{ sectionHeadStyle }}\">\n          <h2 style=\"{{ sectionTitleStyle }}\">How it fits together<\u002Fh2>\n          <p style=\"{{ sectionSubStyle }}\">Our platform runs on three pillars.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"{{ missionGridStyle }}\">\n          <div style=\"{{ missionColStyle }}\">\n            <h4 style=\"{{ missionColTitleStyle }}\">Operations<\u002Fh4>\n            <p style=\"{{ missionItemStyle }}\">Fleet operation<\u002Fp>\n            <p style=\"{{ missionItemStyle }}\">Ride-hailing partner network<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"{{ missionColStyle }}\">\n            <h4 style=\"{{ missionColTitleStyle }}\">Technology<\u002Fh4>\n            <p style=\"{{ missionItemStyle }}\">Fleet management systems<\u002Fp>\n            <p style=\"{{ missionItemStyle }}\">Delivery &amp; logistics technology<\u002Fp>\n            <p style=\"{{ missionItemStyle }}\">Mobility fintech<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"{{ missionColStyle }}\">\n            <h4 style=\"{{ missionColTitleStyle }}\">Trading<\u002Fh4>\n            <p style=\"{{ missionItemStyle }}\">Vehicle import &amp; export<\u002Fp>\n            <p style=\"{{ missionItemStyle }}\">Charging stations<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"{{ posterSectionStyle }}\">\n        <h2 style=\"{{ posterTitleStyle }}\">Building Nepal's mobility infrastructure.<\u002Fh2>\n        <a href=\"#/contact\" style=\"{{ posterBtnStyle }}\">Get in touch<\u002Fa>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isVenture }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <section style=\"{{ ventureHeroStyle }}\">\n        <a href=\"#/\" style=\"{{ backLinkStyle }}\">← All ventures<\u002Fa>\n        <span style=\"{{ heroKickerStyle }}\">{{ currentVenture.category }}<\u002Fspan>\n        <h1 style=\"{{ ventureTitleStyle }}\">{{ currentVenture.name }}<\u002Fh1>\n        <p style=\"{{ heroBodyStyle }}\">{{ currentVenture.tagline }}<\u002Fp>\n        <sc-if value=\"{{ currentVenture.tag }}\" hint-placeholder-val=\"{{ false }} Fp>\n            <h3 style=\"{{ subheadStyleSpaced }}\">General &amp; careers<\u002Fh3>\n            <p style=\"{{ bodyTextStyle }}\"><a href=\"mailto:salina0124@gmail.com\" style=\"{{ inlineLinkStyle }}\">salina0124@gmail.com<\u002Fa> — Salina Sharma, CEO<\u002Fp>\n            <sc-if value=\"{{ showInvestorContact }}\" hint-placeholder-val=\"{{ true }}\">\n              <h3 style=\"{{ subheadStyleSpaced }}\">Partnerships &amp; investment<\u002Fh3>\n              <p style=\"{{ bodyTextStyle }}\"><a href=\"mailto:sandeep.sharma@adhyayan.edu.np\" style=\"{{ inlineLinkStyle }}\">sandeep.sharma@adhyayan.edu.np<\u002Fa> — Sandeep Sharma, Co-founder<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"{{ mapContainerStyle }}\">\n            <iframe src=\"https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14130.863663703625!2d85.31061547832032!3d27.700769237502043!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb18fcb77fd4bd%3A0x58099a1deffed8d3!2sKathmandu%2044600%2C%20Nepal!5e0!3m2!1sen!2snp!4v1699000000000!5m2!1sen!2snp\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\" style=\"{{ iframeStyle }}\"><\u002Fiframe>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <footer style=\"{{ footerStyle }}\">\n    <div style=\"{{ footerGridStyle }}\">\n      <div>\n        <img src=\"64bb0b95-2e33-486a-a3a5-54521ad0e556\" alt=\"Drivra Mobility\" style=\"{{ footerLogoStyle }}\">\n        <p style=\"{{ footerBodyStyle }}\">Building Nepal's mobility infrastructure across ride-hailing, delivery, financing and trading.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"{{ footerHeadStyle }}\">Ventures<\u002Fh4>\n        <sc-for list=\"{{ ventures }}\" as=\"v\" hint-placeholder-count=\"5\">\n          <a href=\"{{ v.href }}\" style=\"{{ footerLinkStyle }}\">{{ v.name }}<\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"{{ footerHeadStyle }}\">Company<\u002Fh4>\n        <a href=\"#/about\" style=\"{{ footerLinkStyle }}\">About<\u002Fa>\n        <a href=\"#/careers\" style=\"{{ footerLinkStyle }}\">Careers<\u002Fa>\n        <a href=\"#/contact\" style=\"{{ footerLinkStyle }}\">Contact<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"{{ footerHeadStyle }}\">Contact<\u002Fh4>\n        <a href=\"tel:+9779768601859\" style=\"{{ footerLinkStyle }}\">+977-9768601859<\u002Fa>\n        <p style=\"{{ footerBodyStyle }}\">Kathmandu, Nepal<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"{{ footerBottomStyle }}\">© 2026 Drivra Mobility Pvt Ltd. All rights reserved.<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1440}, &quot;showInvestorContact&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Contact page&quot;}, &quot;showFleetSignupForm&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Fleet venture page&quot;}}\">\nconst VENTURES = [\n  { id: 'fleet', category: 'OPERATIONS', name: 'Drivra Fleet', tagline: 'Ride-hailing fleets on the road across Kathmandu.',\n    body: \"We operate and grow a fleet of vehicles running on ride-hailing networks, including our partnership with Yango. We handle vehicle onboarding, driver recruitment, maintenance and day-to-day fleet operations, so drivers can focus on the road.\",\n    audienceFor: ['Drivers looking for flexible income', 'Ride-hailing platforms seeking a local operating partner'],\n    photoId: 'venture-fleet', photoPlaceholder: 'Fleet / rider photo' },\n  { id: 'logistics', category: 'TECHNOLOGY', name: 'Drivra Logistics', tagline: 'Delivery and logistics technology for local businesses.',\n    body: \"We build and operate delivery and logistics technology that connects riders with businesses that need goods moved across the city, from dispatch to real-time tracking.\",\n    audienceFor: ['Businesses that need last-mile delivery', 'Delivery riders looking for work'],\n    photoId: 'venture-logistics', photoPlaceholder: 'Delivery rider photo' },\n  { id: 'finance', category: 'TECHNOLOGY', name: 'Drivra Finance', tagline: 'Rent-to-own financing for mobility.',\n    body: \"Our mobility fintech platform is in development. It's designed to give drivers a path to owning their vehicle through structured rent-to-own financing, rather than a lump-sum purchase.\",\n    audienceFor: ['Drivers who want to own a vehicle over time', 'Financing partners'], tag: 'In development',\n    photoId: 'venture-finance', photoPlaceholder: 'Driver / handshake photo' },\n  { id: 'trading', category: 'TRADING', name: 'Drivra Trading', tagline: 'Vehicle import and export for the local market.',\n    body: \"We source and trade vehicles, including electric vehicles, bringing new options to the Nepali market and supporting the transition to electric mobility.\",\n    audienceFor: ['Dealerships and fleet buyers', 'Import and export partners'],\n    photoId: 'venture-trading', photoPlaceholder: 'Vehicle lot photo' },\n  { id: 'charge', category: 'TRADING', name: 'Drivra Charge', tagline: 'Charging infrastructure for electric fleets.',\n    body: \"We build and operate charging stations that keep our electric fleet, and the wider EV community, powered and on the road.\",\n    audienceFor: ['EV fleet operators', 'EV riders and owners'],\n    photoId: 'venture-charge', photoPlaceholder: 'Charging station photo' },\n];\n\nconst TEAM = [\n  { name: 'Sandeep Sharma', role: 'Co-founder', initials: 'SS', bio: 'Educator, engineer and entrepreneur with leadership experience across education, technology, mobility and venture building.' },\n  { name: 'Ayush Subedi', role: 'Co-founder', initials: 'AS', bio: 'Former CTO of Tootle and AI entrepreneur, bringing deep expertise in ride-hailing platforms, artificial intelligence and scalable software systems.' },\n  { name: 'Diwas Shrestha', role: 'Co-founder', initials: 'DS', bio: '15+ years of experience in business development, operations and professional training across Nepal and Australia.' },\n  { name: 'Suman KC', role: 'Co-founder', initials: 'SK', bio: 'Founder of four driving centers across Kathmandu, with extensive expertise in driver training, licensing, recruitment and fleet operations.' },\n  { name: 'Salina Sharma', role: 'CEO', initials: 'SS', bio: 'MBA with 10+ years of experience in project management, business development and organizational leadership.' },\n];\n\n// Accent overridden per-instance below (logo green) via CSS custom properties on the\n// page wrapper; every style in this file reads the token, never a hardcoded hex.\nconst ACCENT_OVERRIDES = {\n  '--color-accent': '#0a6846',\n  '--color-accent-600': '#085537',\n  '--color-accent-700': '#063f28',\n  '--color-accent-100': '#e8f3ee',\n};\nconst RED = 'var(--color-accent)', RED_HOVER = 'var(--color-accent-600)', RED_TEXT = 'var(--color-accent-700)', RED_TINT = 'var(--color-accent-100)';\nconst INK = 'var(--color-text)', BG = 'var(--color-bg)', SURFACE = 'var(--color-surface)', DIVIDER = 'var(--color-divider)';\nconst MUTED = 'color-mix(in srgb, var(--color-text) 60%, transparent)';\nconst FONT = 'var(--font-body)';\n\nfunction parseHash(hash) {\n  const path = (hash || '#/').replace('#', '');\n  const parts = path.split('/').filter(Boolean);\n  if (parts[0] === 'ventures' && parts[1]) return { page: 'venture', ventureId: parts[1] };\n  if (parts[0] === 'about') return { page: 'about' };\n  if (parts[0] === 'careers') return { page: 'careers' };\n  if (parts[0] === 'contact') return { page: 'contact' };\n  return { page: 'home' };\n}\n\nclass Component extends DCLogic {\n  state = {\n    route: parseHash(typeof window !== 'undefined' ? window.location.hash : ''),\n    mobileMenuOpen: false,\n    venturesOpen: false,\n    isMobile: typeof window !== 'undefined' ? window.innerWidth <= 800 : false,\n  };\n\n  componentDidMount() {\n    this._onHash = () => {\n      this.setState({ route: parseHash(window.location.hash), mobileMenuOpen: false, venturesOpen: false });\n      window.scrollTo(0, 0);\n    };\n    this._onResize = () => this.setState({ isMobile: window.innerWidth <= 800 });\n    window.addEventListener('hashchange', this._onHash);\n    window.addEventListener('resize', this._onResize);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('hashchange', this._onHash);\n    window.removeEventListener('resize', this._onResize);\n  }\n\n  toggleMobileMenu = () => this.setState(s => ({ mobileMenuOpen: !s.mobileMenuOpen, venturesOpen: false }));\n  toggleVentures = () => this.setState(s => ({ venturesOpen: !s.venturesOpen }));\n  closeMenus = () => this.setState({ mobileMenuOpen: false, venturesOpen: false });\n\n  renderVals() {\n    const { route, mobileMenuOpen, venturesOpen, isMobile } = this.state;\n    const ventures = VENTURES.map(v => ({ ...v, href: '#/ventures/' + v.id }));\n    const page = route.page;\n    const currentVenture = page === 'venture' ? (ventures.find(v => v.id === route.ventureId) || ventures[0]) : ventures[0];\n\n    const navPad = isMobile ? '14px 20px' : '14px 32px';\n    const heroPad = isMobile ? '56px 20px 40px' : '96px 32px 72px';\n    const sectionPad = isMobile ? '48px 20px' : '72px 32px';\n\n    const linkBase = { color: INK, fontSize: 14, fontWeight: 600, fontFamily: FONT, padding: '6px 2px', borderBottom: '2px solid transparent' };\n    const linkActive = (active) => active ? { ...linkBase, color: RED, borderBottomColor: RED } : linkBase;\n\n    return {\n      ventures, team: TEAM, currentVenture,\n      isHome: page === 'home', isVenture: page === 'venture', isAbout: page === 'about',\n      isCareers: page === 'careers', isContact: page === 'contact',\n      isFleetVenture: page === 'venture' && currentVenture.id === 'fleet',\n      isNotFleetVenture: page === 'venture' && currentVenture.id !== 'fleet',\n      mobileMenuOpen, venturesOpen,\n      showInvestorContact: this.props.showInvestorContact ?? true,\n      showFleetSignupForm: this.props.showFleetSignupForm ?? true,\n\n      toggleMobileMenu: this.toggleMobileMenu, toggleVentures: this.toggleVentures, closeMenus: this.closeMenus,\n\n      pageWrapStyle: { minHeight: '100vh', background: BG, color: INK, fontFamily: FONT, position: 'relative', ...ACCENT_OVERRIDES },\n\n      navBarStyle: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: navPad, borderBottom: '2px solid ' + DIVIDER, background: BG, position: 'sticky', top: 0, zIndex: 100 },\n      navBrandStyle: { display: 'flex', alignItems: 'center' },\n      navLogoStyle: { height: isMobile ? 30 : 36, width: 'auto', display: 'block' },\n      navLinksRowStyle: { display: isMobile ? 'none' : 'flex', alignItems: 'center', gap: 28 },\n      navLinkStyleHome: linkActive(page === 'home'),\n      navLinkStyleAbout: linkActive(page === 'about'),\n      navLinkStyleCareers: linkActive(page === 'careers'),\n      navLinkStyleContact: linkActive(page === 'contact'),\n      navDropdownWrapStyle: { position: 'relative' },\n      navVenturesBtnStyle: { display: 'flex', alignItems: 'center', gap: 4, background: 'none', border: 'none', cursor: 'pointer', ...linkActive(page === 'venture') },\n      chevronStyle: { transform: venturesOpen ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s' },\n      dropdownMenuStyle: { position: 'absolute', top: '100%', left: 0, marginTop: 10, background: BG, border: '2px solid ' + DIVIDER, minWidth: 260, boxShadow: '0 12px 32px rgba(32,30,29,0.22)', zIndex: 50 },\n      dropdownItemStyle: { display: 'flex', flexDirection: 'column', gap: 2, padding: '12px 16px', borderBottom: '1px solid ' + DIVIDER, color: INK, fontSize: 14, fontWeight: 600 },\n      dropdownItemKickerStyle: { fontSize: 10, letterSpacing: '0.1em', color: RED, fontWeight: 600 },\n\n      mobileMenuBtnStyle: { display: isMobile ? 'flex' : 'none', background: 'none', border: 'none', cursor: 'pointer', color: INK, padding: 4 },\n      mobileMenuStyle: { display: 'flex', flexDirection: 'column', padding: '8px 20px 20px', borderBottom: '2px solid ' + DIVIDER, background: BG },\n      mobileLinkStyle: { color: INK, fontSize: 16, fontWeight: 700, padding: '12px 0', borderBottom: '1px solid ' + DIVIDER },\n      mobileGroupLabelStyle: { fontSize: 11, letterSpacing: '0.1em', color: MUTED, fontWeight: 700, marginTop: 12, paddingBottom: 4 },\n      mobileSubLinkStyle: { color: INK, fontSize: 15, fontWeight: 600, padding: '10px 0 10px 12px', borderBottom: '1px solid ' + DIVIDER },\n\n      heroSectionStyle: { padding: heroPad, maxWidth: 900 },\n      homeHeroGridStyle: { padding: heroPad, display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1.1fr 1fr', gap: isMobile ? 32 : 48, alignItems: 'center' },\n      heroImageWrapStyle: { width: '100%', aspectRatio: '4 / 3', filter: 'grayscale(1) contrast(1.08)' },\n      ventureImageSectionStyle: { borderTop: '2px solid ' + DIVIDER },\n      ventureImageWrapStyle: { width: '100%', aspectRatio: isMobile ? '16 / 10' : '21 / 8', filter: 'grayscale(1) contrast(1.08)' },\n      pageHeroStyle: { padding: heroPad, maxWidth: 800 },\n      ventureHeroStyle: { padding: heroPad, maxWidth: 800, display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'flex-start' },\n      backLinkStyle: { color: RED_TEXT, fontSize: 13, fontWeight: 700, marginBottom: 8 },\n      heroKickerStyle: { fontSize: 12, letterSpacing: '0.12em', color: RED, fontWeight: 700, margin: '0 0 12px' },\n      heroTitleStyle: { fontSize: isMobile ? 32 : 52, fontWeight: 800, lineHeight: 1.08, letterSpacing: '-0.02em', margin: '0 0 20px' },\n      pageTitleStyle: { fontSize: isMobile ? 30 : 44, fontWeight: 800, lineHeight: 1.1, margin: '0 0 16px' },\n      ventureTitleStyle: { fontSize: isMobile ? 30 : 44, fontWeight: 800, lineHeight: 1.1, margin: 0 },\n      heroBodyStyle: { fontSize: isMobile ? 16 : 19, lineHeight: 1.55, color: 'rgba(32,30,29,0.8)', maxWidth: 640, margin: 0 },\n      heroCtaRowStyle: { display: 'flex', gap: 'var(--space-4)', marginTop: 'var(--space-8)', flexWrap: 'wrap' },\n\n      btnPrimaryStyle: { display: 'inline-flex', alignItems: 'center', justifyContent: 'flex-start', background: RED, color: BG, fontFamily: 'var(--font-heading)', fontWeight: 'var(--font-heading-weight)', fontSize: 14, padding: 'var(--space-3) calc(var(--space-3) * 1.6)', border: '1px solid ' + RED, borderRadius: 'var(--radius-md)' },\n      btnSecondaryStyle: { display: 'inline-flex', alignItems: 'center', justifyContent: 'flex-start', background: 'transparent', color: INK, fontFamily: 'var(--font-heading)', fontWeight: 'var(--font-heading-weight)', fontSize: 14, padding: 'var(--space-3) calc(var(--space-3) * 1.6)', border: '1px solid ' + DIVIDER, borderRadius: 'var(--radius-md)' },\n      tagOutlineStyle: { display: 'inline-flex', border: '1px solid ' + RED, color: RED_TEXT, fontSize: 11, letterSpacing: '0.02em', fontWeight: 700, padding: '3px 10px', marginTop: 4, borderRadius: 'calc(var(--radius-md) * 0.75)' },\n\n      sectionStyle: { padding: sectionPad, borderTop: '2px solid ' + DIVIDER },\n      sectionHeadStyle: { marginBottom: isMobile ? 28 : 44 },\n      sectionTitleStyle: { fontSize: isMobile ? 26 : 34, fontWeight: 800, margin: '0 0 8px' },\n      sectionSubStyle: { fontSize: 16, color: MUTED, margin: 0 },\n\n      ventureGridStyle: { display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fit, minmax(280px, 1fr))', gap: 2, background: DIVIDER, border: '2px solid ' + DIVIDER },\n      ventureCardStyle: { display: 'flex', flexDirection: 'column', gap: 'var(--space-2)', background: SURFACE, padding: 'var(--space-6)', color: INK },\n      cardKickerStyle: { fontSize: 10, letterSpacing: '0.1em', color: RED, fontWeight: 700 },\n      cardTitleStyle: { fontSize: 21, fontWeight: 800, margin: 0 },\n      cardBodyStyle: { fontSize: 14, color: 'rgba(32,30,29,0.75)', margin: 0, flex: 1 },\n      cardLinkStyle: { fontSize: 13, fontWeight: 700, color: RED_TEXT, marginTop: 6 },\n\n      missionGridStyle: { display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(3, 1fr)', gap: isMobile ? 28 : 40 },\n      missionColStyle: { display: 'flex', flexDirection: 'column', gap: 6, borderTop: '2px solid ' + INK, paddingTop: 14 },\n      missionColTitleStyle: { fontSize: 15, fontWeight: 800, margin: '0 0 4px' },\n      missionItemStyle: { fontSize: 15, margin: 0, color: 'rgba(32,30,29,0.8)' },\n\n      hrStyle: { height: 2, border: 0, margin: 0, background: DIVIDER },\n\n      posterSectionStyle: { background: RED, color: BG, padding: isMobile ? '56px 20px' : '90px 32px', textAlign: 'left', display: 'flex', flexDirection: isMobile ? 'column' : 'row', alignItems: isMobile ? 'flex-start' : 'center', justifyContent: 'space-between', gap: 24 },\n      posterTitleStyle: { fontSize: isMobile ? 28 : 40, fontWeight: 800, margin: 0, maxWidth: 640, lineHeight: 1.1 },\n      posterBtnStyle: { display: 'inline-flex', flex: 'none', background: BG, color: RED_TEXT, fontFamily: FONT, fontWeight: 800, fontSize: 14, padding: '13px 26px' },\n\n      subheadStyle: { fontSize: 13, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 700, color: MUTED, margin: '0 0 12px' },\n      subheadStyleSpaced: { fontSize: 13, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 700, color: MUTED, margin: '24px 0 8px' },\n      bodyTextStyle: { fontSize: 16, lineHeight: 1.65, margin: '0 0 8px', maxWidth: 560 },\n      ventureBodyGridStyle: { display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1.4fr 1fr', gap: isMobile ? 32 : 48, marginBottom: 40 },\n      audienceItemStyle: { fontSize: 15, padding: '10px 0', borderBottom: '1px solid ' + DIVIDER, margin: 0 },\n      ctaBlockStyle: { display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'flex-start', paddingTop: 8 },\n      formContainerStyle: { width: '100%', background: SURFACE, padding: isMobile ? 16 : 24, border: '1px solid ' + DIVIDER },\n      iframeStyle: { width: '100%', minHeight: 700, border: 'none', display: 'block' },\n\n      teamGridStyle: { display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fit, minmax(240px, 1fr))', gap: 2, background: DIVIDER, border: '2px solid ' + DIVIDER },\n      teamCardStyle: { background: SURFACE, padding: 'var(--space-6)', display: 'flex', flexDirection: 'column', gap: 'var(--space-2)' },\n      teamAvatarStyle: { width: 48, height: 48, background: RED, color: BG, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 15 },\n      teamNameStyle: { fontSize: 17, fontWeight: 800, margin: 0 },\n      teamRoleStyle: { fontSize: 12, fontWeight: 700, color: RED_TEXT, margin: 0, letterSpacing: '0.03em', textTransform: 'uppercase' },\n      teamBioStyle: { fontSize: 14, color: 'rgba(32,30,29,0.75)', margin: '4px 0 0', lineHeight: 1.5 },\n\n      tagRowStyle: { display: 'flex', gap: 'var(--space-2)', flexWrap: 'wrap', marginBottom: 'var(--space-8)' },\n      tagAccentStyle: { display: 'inline-flex', background: RED_TINT, color: RED_TEXT, fontSize: 11, fontWeight: 700, letterSpacing: '0.02em', padding: '3px 10px' },\n\n      contactGridStyle: { display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: isMobile ? 32 : 48 },\n      inlineLinkStyle: { color: RED_TEXT, fontWeight: 700 },\n      mapContainerStyle: { width: '100%', minHeight: isMobile ? 260 : 380, border: '1px solid ' + DIVIDER, overflow: 'hidden' },\n\n      footerStyle: { borderTop: '2px solid ' + DIVIDER, padding: isMobile ? '40px 20px 24px' : '56px 32px 28px', background: BG },\n      footerGridStyle: { display: 'grid', gridTemplateColumns: isMobile ? '1fr 1fr' : 'repeat(4, 1fr)', gap: 32, marginBottom: 32 },\n      footerLogoStyle: { height: 32, marginBottom: 12 },\n      footerBodyStyle: { fontSize: 13, color: MUTED, lineHeight: 1.5, maxWidth: 260, margin: '4px 0' },\n      footerHeadStyle: { fontSize: 12, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 700, margin: '0 0 12px' },\n      footerLinkStyle: { display: 'block', color: INK, fontSize: 14, fontWeight: 600, marginBottom: 8 },\n      footerBottomStyle: { borderTop: '1px solid ' + DIVIDER, paddingTop: 20, fontSize: 12, color: MUTED },\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
